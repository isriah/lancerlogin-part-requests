<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pair this device</title></head>
<body style="font: 14px system-ui; width: 320px; padding: 12px">
  <h1 style="font-size: 16px">Pair this device</h1>
  <label>Site address <input id="address" type="url" style="width: 100%" autocomplete="off"></label>
  <label>PIN <input id="pin" style="width: 100%" autocomplete="off"></label>
  <label>API path <input id="prefix" value="/api" style="width: 100%" autocomplete="off"></label>
  <p><button id="pair" type="button">Pair</button></p>
  <p id="result" role="status"></p>
  <script src="pair.js" type="module"></script>
</body>
</html>
